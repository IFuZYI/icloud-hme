name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Lint
        run: npm --prefix web run lint

      - name: Test
        run: npm --prefix web run test:run

      - name: Build
        run: npm --prefix web run build

      - name: Upload dist for Go job
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist/
          if-no-files-found: error

  go:
    name: Go (test + vet + build)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist/

      - name: Test
        run: go test -race ./internal/... .

      # 时区矩阵: 调度/作息/周期日逻辑按任务时区计算, DST 折叠与跨时区一致性
      # 回归只在非 UTC 时区暴露(曾发生 Denver/Berlin 下失败而 UTC 全绿)。
      # 用固定的一组代表时区锁住该类回归, 避免 CI 在默认 UTC 下静默放行。
      - name: Test (timezone matrix)
        run: |
          for tz in America/Denver America/New_York Europe/Berlin Asia/Shanghai Australia/Brisbane; do
            echo "=== TZ=$tz ==="
            TZ=$tz go test ./internal/server/ ./internal/account/ ./internal/hme/ -count=1
          done

      - name: Vet
        run: go vet ./internal/... .

      - name: Build
        run: go build ./internal/... .
