services:
  # 一次性初始化: 全新部署时 docker 会把 ./data 建成 root 所有, 而应用以
  # 非 root(10001) 运行。该服务在应用启动前把数据目录授权给运行用户,
  # 之后即退出(重启策略 no)。已有目录不会丢数据。
  init-data:
    image: alpine:3.21
    container_name: icloud-hme-init
    command:
      - sh
      - -c
      - mkdir -p /data && chown -R ${ICLOUD_HME_UID:-10001}:${ICLOUD_HME_GID:-10001} /data
    volumes:
      - ./data:/data
    user: "0:0"
    restart: "no"

  icloud-hme:
    build:
      context: .
      dockerfile: Dockerfile
    image: icloud-hme:latest
    container_name: icloud-hme
    restart: unless-stopped
    init: true
    depends_on:
      init-data:
        condition: service_completed_successfully
    ports:
      - "${ICLOUD_HME_PORT:-8081}:8081"
    environment:
      # 必填：管理员密码（至少 8 字符）。通过 .env 或宿主环境变量提供。
      ICLOUD_HME_ADMIN_PASSWORD: "${ICLOUD_HME_ADMIN_PASSWORD:?请通过 .env 或环境变量设置 ICLOUD_HME_ADMIN_PASSWORD}"
      ICLOUD_HME_SESSION_TTL: "${ICLOUD_HME_SESSION_TTL:-12h}"
      ICLOUD_HME_SECURE_COOKIE: "${ICLOUD_HME_SECURE_COOKIE:-false}"
      # 日志:级别 debug/info/warn/error,格式 text/json。排查问题时设为 debug。
      # 日志默认持久化到 /app/data/logs(随下方 data 卷落盘,按大小滚动 10MB×5)。
      # 设为空字符串可关闭文件输出、只保留容器 stdout/stderr(docker logs)。
      ICLOUD_HME_LOG_LEVEL: "${ICLOUD_HME_LOG_LEVEL:-info}"
      ICLOUD_HME_LOG_FORMAT: "${ICLOUD_HME_LOG_FORMAT:-text}"
      ICLOUD_HME_LOG_DIR: "${ICLOUD_HME_LOG_DIR:-/app/data/logs}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      # 账号配置 (accounts.json)、自动任务配置与日志持久化
      # 注意: 容器以非 root(UID 10001)运行, 宿主机目录需对该 UID 可写:
      #   sudo chown -R 10001:10001 ./data      (或设置 ICLOUD_HME_UID 为宿主用户 UID)
      - ./data:/app/data
    # 运行用户: 默认镜像内的 app(10001)。若宿主机 ./data 属于其他用户,
    # 在 .env 里设置 ICLOUD_HME_UID/ICLOUD_HME_GID 为 `id -u`/`id -g` 即可。
    user: "${ICLOUD_HME_UID:-10001}:${ICLOUD_HME_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s
